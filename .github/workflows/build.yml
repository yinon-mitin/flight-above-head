name: Arduino build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install "ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.14"
          arduino-cli lib install "ArduinoJson@7.4.3"
          arduino-cli lib install "Adafruit GFX Library@1.12.6"

      - name: Compile secret-free ESP32-S3 build
        run: |
          # Arduino requires a sketch directory named after its main .ino file.
          # GitHub checks out this repository as "flight-above-head", so compile
          # an isolated copy with the required FlightAboveHead directory name.
          cp -a . /tmp/FlightAboveHead
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB,USBMode=hwcdc,CDCOnBoot=cdc \
            /tmp/FlightAboveHead
