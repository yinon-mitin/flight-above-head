<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Flight Above Head</title>
  <desc id="desc">An amber aircraft orbiting a radar display above the Flight Above Head wordmark.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121f"/>
      <stop offset="1" stop-color="#112a42"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1ed7c6" stop-opacity="0"/>
      <stop offset="1" stop-color="#1ed7c6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="30" fill="url(#sky)"/>
  <g transform="translate(180 180)" fill="none" stroke="#1ed7c6" opacity=".48">
    <circle r="128" stroke-width="2"/>
    <circle r="88" stroke-width="2"/>
    <circle r="48" stroke-width="2"/>
    <path d="M-142 0H142M0-142V142" stroke-width="1"/>
    <path d="M-104-104L104 104M104-104L-104 104" stroke-width="1"/>
  </g>
  <path d="M40 180C95 114 151 102 248 130" fill="none" stroke="url(#trail)" stroke-width="6" stroke-linecap="round"/>
  <g transform="translate(234 126) rotate(22)" filter="url(#glow)">
    <path d="M0-58L12-10 74 16 74 29 11 22 5 61-8 61-14 22-76 29-76 16-14-10-2-58Z" fill="#ffb547"/>
    <path d="M-2-44L4-11 53 12-2 4-57 12-8-11Z" fill="#fff3d1" opacity=".9"/>
  </g>
  <g transform="translate(390 0)">
    <text x="0" y="158" fill="#f6fbff" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">FLIGHT</text>
    <text x="0" y="230" fill="#a9c4d9" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="50" font-weight="600" letter-spacing="12">ABOVE HEAD</text>
    <rect x="2" y="257" width="400" height="3" rx="2" fill="#1ed7c6"/>
    <text x="0" y="304" fill="#7f9db4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">ESP32-S3 · HUB75 · LIVE AIRSPACE</text>
  </g>
</svg>
